name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Database security tests (PGlite)
        run: npx vitest run db-tests
      - name: Type-check and build
        run: npm run build
      - name: Dev backend must not ship
        run: "! grep -rl -e '__devdb' -e 'pugmark-dev' dist"
